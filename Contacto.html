<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto</title>
  <link rel="stylesheet" href="Contacto.css">
</head>
<body>

  <header></header>

  <main>
    <h1>Contacto</h1>

    <div class="contenedor">
      <h2 class="subtitulo">¿Tienes algún proyecto en mente? ¡Pregúntanos!</h2>

      <div class="caja-formulario">
        <form>
          <div class="fila">
            <div class="grupo">
              <label for="nombre">Nombre*</label>
              <input type="text" id="nombre" name="nombre">
            </div>
            <div class="grupo">
              <label for="apellido">Apellido</label>
              <input type="text" id="apellido" name="apellido">
            </div>
          </div>

          <div class="fila">
            <div class="grupo">
              <label for="email">Email*</label>
              <input type="email" id="email" name="email">
            </div>
            <div class="grupo">
              <label for="telefono">Teléfono*</label>
              <input type="tel" id="telefono" name="telefono">
            </div>
          </div>

          <div class="grupo">
            <label for="asunto">Asunto*</label>
            <input type="text" id="asunto" name="asunto">
          </div>

          <div class="grupo">
            <label for="mensaje">Mensaje*</label>
            <textarea id="mensaje" name="mensaje" rows="4"></textarea>
          </div>

          <div class="casilla">
            <input type="checkbox" id="terminos" name="terminos" checked>
            <label for="terminos">Acepto los términos y condiciones</label>
          </div>

          <div class="boton-contenedor">
            <button type="submit">ENVIAR</button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <footer>
    <div class="copyright">
            <p>© 2026 Roketto - Todos los derechos reservados</p>
        </div>
        <div id="iconos">
            <a href="https://www.instagram.com/rokettotaldea/"><img src="logos/ins.png" alt="Instagram" id="ins" loading="lazy"></a>
            <a href="https://youtube.com/@rokettotaldea?si=IT-pe8gwuVvj0Im-"><img src="logos/youtube.png" alt="Youtube" id="youtube" loading="lazy"></a>
            <a href="https://x.com/R0k3tt0"><img src="logos/Twitter_X.png" alt="X (Twitter)" id="x" loading="lazy"></a>
        </div>
        <div class="footer-links">
            <p><a href="https://docs.google.com/document/d/1_ZGNFclkFJYe2FuVkpsO0hyv2pfxolW-hbnZJvJg0cg/edit?usp=drive_link" class="final">Aviso Legal</a></p>
            <p><a href="https://docs.google.com/document/d/1RoZrDdjFUcd2ZPzIi-6sHdpcf8v-r7y5Tq8RTqHmK3w/edit?usp=drive_link" class="final">Politica de Privacidad</a></p>
            <p><a href="https://docs.google.com/document/d/1SgULGOs6Gg-1JARw4ZWVgIeqgTWROc6XmjFlDJBQ_jE/edit?usp=drive_link" class="final">Politica de cookies</a></p>
        </div>
    </footer>

</body>
</html>
