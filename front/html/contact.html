<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - Roketto</title>
  <link rel="stylesheet" href="../css/estilos.css">
</head>
<body class="contacto">

  <header class="header">
        <nav class="nav" aria-label="Main navigation">
            <ul class="nav_lista">
                <li>
                    <a href="index_en.html" class="header_logo">
                        <img src="../assets/logo.png" alt="Roketto – Home"/>
                    </a></li>
                <li><a href="team.html">Team</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="contact.html" aria-current="page">Contact</a></li>
            </ul>
        </nav>

        <div class="header_idioma">
            <a href="contacto.html" hreflang="es" lang="es">Español</a>
        </div>
    </header>

  <main class="contacto-principal pagina">
    <div class="contacto-centrado">
      <h1>Contact</h1>
      <nav class="breadcrumb" aria-label="Breadcrumb">
        <ul>
          <li><a href="index_en.html">Roketto</a></li>
          <li aria-current="page">Contact</li>
        </ul>
      </nav>

      <div class="contacto_contenedor">
        <h2 class="contacto_subtitulo">Do you have a project in mind? Ask us!</h2>

        <div class="caja-formulario">
          <form>
            <p class="contacto_aviso">Fields marked with * are required.</p>

            <div class="contacto_fila">
              <div class="contacto_grupo">
                <label for="nombre">First name*</label>
                <input type="text" id="nombre" name="nombre" required>
              </div>
              <div class="contacto_grupo">
                <label for="apellido">Last name</label>
                <input type="text" id="apellido" name="apellido">
              </div>
            </div>
            <div class="contacto_fila">
              <div class="contacto_grupo">
                <label for="email">Email*</label>
                <input type="email" id="email" name="email" required>
              </div>
              <div class="contacto_grupo">
                <label for="telefono">Phone*</label>
                <input type="tel" id="telefono" name="telefono" required>
              </div>
            </div>

            <div class="contacto_grupo">
              <label for="asunto">Subject*</label>
              <input type="text" id="asunto" name="asunto" required>
            </div>

            <div class="contacto_grupo">
              <label for="mensaje">Message*</label>
              <textarea id="mensaje" name="mensaje" rows="4" required></textarea>
            </div>

            <div class="contacto_casilla">
              <input type="checkbox" id="privacidad" name="privacidad" required>
              <label for="privacidad">I have read and accept the <a href="privacy-policy.html">privacy policy</a></label>
            </div>

            <div class="boton-contenedor">
              <button type="submit">Send</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="copyright">
            <p>© 2026 Roketto - All rights reserved</p>
        </div>
        <div id="iconos">
            <a href="https://www.instagram.com/rokettotaldea/"><img src="../assets/instagram.svg" alt="Instagram" id="ins" loading="lazy"></a>
            <a href="https://youtube.com/@rokettotaldea?si=IT-pe8gwuVvj0Im-"><img src="../assets/youtube.svg" alt="YouTube" id="youtube" loading="lazy"></a>
            <a href="https://x.com/R0k3tt0"><img src="../assets/x.svg" alt="X (Twitter)" id="x" loading="lazy"></a>
        </div>
        <div class="footer-links">
            <p><a href="work-with-us.html" class="final">Work with us</a></p>
            <p><a href="legal-notice.html" class="final">Legal Notice</a></p>
            <p><a href="privacy-policy.html" class="final">Privacy Policy</a></p>
            <p><a href="cookie-policy.html" class="final">Cookie Policy</a></p>
        </div>
    </footer>

</body>
</html>
