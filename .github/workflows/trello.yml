# Sincroniza la actividad del repositorio con el tablero de Trello.
#
# Para enlazar una tarjeta, menciónala en el mensaje del commit, o en el título,
# la descripción o el nombre de la rama de un PR, de una de estas formas:
#   - T#12                              (número de la tarjeta en el tablero)
#   - https://trello.com/c/AbCd1234     (URL de la tarjeta)
#
# Qué hace:
#   - push            -> comenta el commit en la tarjeta
#   - PR abierto      -> comenta el PR y mueve la tarjeta a la lista de revisión
#   - PR mergeado     -> comenta y, si es en develop o main, mueve la tarjeta a la lista de terminado
#
# Configuración (Settings -> Secrets and variables -> Actions):
#   Secrets:   TRELLO_API_KEY, TRELLO_TOKEN
#   Variables: TRELLO_LIST_REVIEW (por defecto "En revisión")
#              TRELLO_LIST_DONE   (por defecto "Hecho")

name: Trello

on:
  push:
  pull_request:
    types: [opened, reopened, ready_for_review, closed]

jobs:
  trello:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          TRELLO_API_KEY: ${{ secrets.TRELLO_API_KEY }}
          TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
          TRELLO_BOARD: JhE7MMqD
          TRELLO_LIST_REVIEW: ${{ vars.TRELLO_LIST_REVIEW || 'En revisión' }}
          TRELLO_LIST_DONE: ${{ vars.TRELLO_LIST_DONE || 'Hecho' }}
        with:
          script: |
            const { TRELLO_API_KEY, TRELLO_TOKEN, TRELLO_BOARD } = process.env;
            if (!TRELLO_API_KEY || !TRELLO_TOKEN) {
              core.warning('Faltan los secrets TRELLO_API_KEY / TRELLO_TOKEN; no se hace nada.');
              return;
            }

            async function trello(method, path, params = {}) {
              const url = new URL(`https://api.trello.com/1${path}`);
              for (const [k, v] of Object.entries({ ...params, key: TRELLO_API_KEY, token: TRELLO_TOKEN })) {
                url.searchParams.set(k, v);
              }
              const res = await fetch(url, { method });
              if (!res.ok) throw new Error(`Trello ${method} ${path}: ${res.status} ${await res.text()}`);
              return res.json();
            }

            // Devuelve los ids de las tarjetas mencionadas en el texto.
            async function findCards(text) {
              const ids = new Set();
              for (const [, shortLink] of text.matchAll(/trello\.com\/c\/([A-Za-z0-9]{8})/g)) {
                try { ids.add((await trello('GET', `/cards/${shortLink}`, { fields: 'id' })).id); }
                catch (e) { core.warning(e.message); }
              }
              for (const [, num] of text.matchAll(/\bT#(\d+)\b/g)) {
                try { ids.add((await trello('GET', `/boards/${TRELLO_BOARD}/cards/${num}`, { fields: 'id' })).id); }
                catch (e) { core.warning(e.message); }
              }
              return [...ids];
            }

            async function moveTo(cardId, listName) {
              const lists = await trello('GET', `/boards/${TRELLO_BOARD}/lists`, { fields: 'name' });
              const list = lists.find(l => l.name.trim().toLowerCase() === listName.trim().toLowerCase());
              if (!list) {
                core.warning(`No existe la lista "${listName}" en el tablero.`);
                return;
              }
              await trello('PUT', `/cards/${cardId}`, { idList: list.id });
            }

            const comment = (cardId, text) => trello('POST', `/cards/${cardId}/actions/comments`, { text });

            if (context.eventName === 'push') {
              const branch = context.ref.replace('refs/heads/', '');
              for (const commit of context.payload.commits || []) {
                for (const cardId of await findCards(commit.message)) {
                  await comment(cardId,
                    `💻 Commit en \`${branch}\` por ${commit.author.name}:\n> ${commit.message.split('\n')[0]}\n${commit.url}`);
                }
              }
              return;
            }

            const pr = context.payload.pull_request;
            const cards = await findCards(`${pr.title}\n${pr.body || ''}\n${pr.head.ref}`);
            const action = context.payload.action;

            for (const cardId of cards) {
              if (action === 'closed') {
                if (!pr.merged) continue;
                await comment(cardId, `✅ PR #${pr.number} mergeado en \`${pr.base.ref}\`: ${pr.title}\n${pr.html_url}`);
                if (['develop', 'main'].includes(pr.base.ref)) await moveTo(cardId, process.env.TRELLO_LIST_DONE);
              } else if (!pr.draft) {
                await comment(cardId, `🔀 PR #${pr.number} abierto por ${pr.user.login}: ${pr.title}\n${pr.html_url}`);
                await moveTo(cardId, process.env.TRELLO_LIST_REVIEW);
              }
            }
